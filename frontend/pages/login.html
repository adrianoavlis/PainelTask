<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainelTask — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: var(--pt-bg-page); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="login-card p-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fas fa-tasks me-2"></i>PainelTask</h2>
        <p class="text-muted">Sistema de Gestão de Tarefas</p>
    </div>

    <div id="alert-area"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-3">Entrar</h5>
            <form id="form-login">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" id="login-password" required placeholder="••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="btn-login">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="login-spinner"></span>
                    Entrar
                </button>
            </form>
            <hr>
            <p class="text-center text-muted small mb-0">
                <i class="fas fa-lock me-1"></i>Acesso restrito. Solicite ao administrador do sistema.
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    if (auth.getToken()) window.location.href = 'dashboard.html';

    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const spinner = document.getElementById('login-spinner');
        const btn = document.getElementById('btn-login');
        spinner.classList.remove('d-none');
        btn.disabled = true;

        try {
            const res = await api.post('/auth/login', {
                email:    document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            });
            auth.setSession(res.data.token, res.data.user);
            window.location.href = 'dashboard.html';
        } catch (err) {
            document.getElementById('alert-area').innerHTML =
                `<div class="alert alert-danger">${err.message}</div>`;
        } finally {
            spinner.classList.add('d-none');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
