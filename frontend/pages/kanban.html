<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainelTask — Kanban</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .kanban-col { min-height: 400px; }
        .kanban-col.drag-over { background: rgba(var(--bs-primary-rgb), .06); border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<div id="navbar"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="fas fa-columns me-2 text-primary"></i>Kanban</h4>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNewTask">
            <i class="fas fa-plus me-1"></i>Nova Tarefa
        </button>
    </div>

    <div class="row g-3">
        <!-- A Fazer -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-secondary text-white d-flex justify-content-between">
                    <span><i class="fas fa-circle me-2"></i>A Fazer</span>
                    <span class="badge bg-white text-secondary" id="count-TODO">0</span>
                </div>
                <div class="card-body kanban-col p-2" id="col-TODO"
                     ondragover="onDragOver(event)"
                     ondrop="onDrop(event, 'TODO')"
                     ondragenter="this.classList.add('drag-over')"
                     ondragleave="this.classList.remove('drag-over')">
                </div>
            </div>
        </div>

        <!-- Em Progresso -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-primary text-white d-flex justify-content-between">
                    <span><i class="fas fa-spinner me-2"></i>Em Progresso</span>
                    <span class="badge bg-white text-primary" id="count-DOING">0</span>
                </div>
                <div class="card-body kanban-col p-2" id="col-DOING"
                     ondragover="onDragOver(event)"
                     ondrop="onDrop(event, 'DOING')"
                     ondragenter="this.classList.add('drag-over')"
                     ondragleave="this.classList.remove('drag-over')">
                </div>
            </div>
        </div>

        <!-- Concluído -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-success text-white d-flex justify-content-between">
                    <span><i class="fas fa-check-circle me-2"></i>Concluído</span>
                    <span class="badge bg-white text-success" id="count-DONE">0</span>
                </div>
                <div class="card-body kanban-col p-2" id="col-DONE"
                     ondragover="onDragOver(event)"
                     ondrop="onDrop(event, 'DONE')"
                     ondragenter="this.classList.add('drag-over')"
                     ondragleave="this.classList.remove('drag-over')">
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal Nova Tarefa -->
<div class="modal fade" id="modalNewTask" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nova Tarefa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-new-task">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text" class="form-control" id="task-title" required>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="task-status">
                                <option value="TODO">A Fazer</option>
                                <option value="DOING">Em Progresso</option>
                                <option value="DONE">Concluído</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Prioridade</label>
                            <select class="form-select" id="task-priority">
                                <option value="LOW">Baixa</option>
                                <option value="MEDIUM" selected>Média</option>
                                <option value="HIGH">Alta</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-2">
                        <label class="form-label">Data limite</label>
                        <input type="date" class="form-control" id="task-due-date">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar Tarefa</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/kanban.js"></script>
</body>
</html>
