<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainelTask — Colaboradores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0"><i class="fas fa-users me-2 text-primary"></i>Colaboradores</h4>
            <div class="text-muted small">Gerencie os colaboradores que podem ser alocados em atividades</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-danger">ADMIN</span>
            <button class="btn btn-primary btn-sm" onclick="openCreate()">
                <i class="fas fa-user-plus me-1"></i>Novo Colaborador
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th>Cadastrado em</th>
                        <th style="width:150px">Ações</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="6" class="text-center py-4">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Criar / Editar Colaborador -->
<div class="modal fade" id="modalColaborador" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-colab-title">Novo Colaborador</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-colaborador">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" id="colab-name" required placeholder="Nome completo">
                    </div>
                    <div class="mb-3" id="colab-email-group">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" id="colab-email" required placeholder="email@empresa.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" id="colab-password-label">Senha *</label>
                        <input type="password" class="form-control" id="colab-password" placeholder="Mínimo 6 caracteres">
                        <div class="form-text text-muted" id="colab-password-hint"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Perfil</label>
                        <select class="form-select" id="colab-role">
                            <option value="USER">Colaborador</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/users.js"></script>
</body>
</html>
