<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PainelTask — Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div id="navbar"></div>

<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="fas fa-chart-bar me-2 text-primary"></i>Dashboard</h4>
        <a href="tasks.html" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nova Tarefa
        </a>
    </div>

    <!-- Status Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="text-muted small mb-1">Total</div>
                    <div class="display-6 fw-bold" id="total-tasks">—</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="text-secondary small mb-1">A Fazer</div>
                    <div class="display-6 fw-bold text-secondary" id="tasks-todo">—</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="text-primary small mb-1">Em Progresso</div>
                    <div class="display-6 fw-bold text-primary" id="tasks-doing">—</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center h-100">
                <div class="card-body">
                    <div class="text-success small mb-1">Concluído</div>
                    <div class="display-6 fw-bold text-success" id="tasks-done">—</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Taxa de conclusão -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Taxa de Conclusão</h6>
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span class="display-6 fw-bold text-success" id="completion-rate">—</span>
                    </div>
                    <div class="progress" style="height: 12px;">
                        <div class="progress-bar bg-success" id="completion-bar" role="progressbar"
                             style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                        </div>
                    </div>
                    <div class="mt-3 text-muted small">
                        <i class="fas fa-exclamation-triangle text-warning me-1"></i>
                        <span id="tasks-overdue">—</span> tarefa(s) em atraso
                    </div>
                </div>
            </div>
        </div>

        <!-- Prioridades -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Por Prioridade</h6>
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-danger px-3">Alta</span>
                            <span class="fw-bold" id="priority-high">—</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-warning text-dark px-3">Média</span>
                            <span class="fw-bold" id="priority-medium">—</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-success px-3">Baixa</span>
                            <span class="fw-bold" id="priority-low">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Relatórios -->
    <div class="row g-3 mt-1">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <h6 class="fw-bold mb-0"><i class="fas fa-file-pdf me-2 text-danger"></i>Relatórios em PDF</h6>
                        <div class="text-muted small">Exporte suas atividades ou o relatório completo do sistema</div>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button id="btn-report-me" class="btn btn-outline-primary btn-sm" onclick="downloadReport('me')">
                            <i class="fas fa-download me-1"></i>Minhas Atividades
                        </button>
                        <button id="btn-report-admin" class="btn btn-danger btn-sm d-none" onclick="downloadReport('admin')">
                            <i class="fas fa-file-pdf me-1"></i>Relatório Completo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
